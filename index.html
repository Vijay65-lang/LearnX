    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress expected sandbox WebSocket reconnection noise when HMR is disabled
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket') ||
           String(event.reason?.message || '').includes('WebSocket closed without opened'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') || event.message.includes('[vite]'))
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
